<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineHub</title>

    <link rel="stylesheet" href="src/css/style.css">

    <!-- FONTE AWESOME -->
    <script src="https://kit.fontawesome.com/4a8702ae6d.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- HEADER -->
    <header class="header">

        <div class="container">

            <a href="#" class="logo">
                <i class="fa-solid fa-film"></i>
                CineList
            </a>

            <nav class="navbar">
                <a href="#" class="nav-link">Início</a>

                <button class="btn-add-filme" id="open-modal">
                    <i class="fa-solid fa-circle-plus"></i>
                    Adicionar Filme
                </button>
            </nav>

        </div>

    </header>

    <!-- MAIN -->
    <main>
        <section class="catalogo">

            <div class="catalogo-header">
                <h1>Catalogo de Filmes</h1>

                <div class="barra-pesquisa">
                    <label for="pesquisa-filme" class="sr-only">
                        Pesquisar filme
                    </label>

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input 
                        type="search"
                        placeholder="Pesquisar filme"
                        id="pesquisa-filme"
                        name="pesquisa"
                        autocomplete="off"
                    >
                </div>
            </div>

            <div class="filmes-grid" id="filmes-container">
                <!-- CARDS SERÃO INSERIDOS PELO JS -->
            </div>

        </section>
    </main>

    <!-- MODAL ADICIONAR FILME -->
    <div class="modal" id="filme-modal">

        <div class="modal-conteudo">

            <div class="modal-header">
                <h2>Adicionar Filme</h2>

                <button
                    type="button"
                    class="close-modal"
                    id="close-modal"
                    aria-label="Fechar"
                >
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
                
            </div>

            <form id="filme-form">
                <div class="form-grupo">
                    <label for="filme-titulo">
                        Título
                    </label>

                    <input type="text" name="titulo" id="filme-titulo" placeholder="Digite o título do filme">
                </div>

                <div class="form-grupo">
                    <label for="filme-categoria">
                        Categoria
                    </label>

                    <input type="text" name="categoria" id="filme-categoria" placeholder="Ex: Ação">
                </div>

                <div class="form-grupo">
                    <label for="filme-ano">
                        Ano de Lançamento
                    </label>

                    <input type="number" name="ano" id="filme-ano" placeholder="Ex: 2025">
                </div>

                <div class="form-grupo">

                    <label for="filme-imagem-url">
                        URL da imagem
                    </label>

                    <input
                        type="url"
                        id="filme-imagem-url"
                        name="imagem-url"
                        placeholder="https://exemplo.com/imagem.jpg"
                    >

                </div>

                <div class="form-grupo imagem-arquivo">
                    <label for="filme-imagem-arquivo">
                        Imagem
                    </label>

                    <input 
                        type="file" 
                        accept="image/jpeg, image/png, image/webp" 
                        name="imagem-arquivo" 
                        id="filme-imagem-arquivo" 
                        placeholder="Insira a imagem"
                    >
                </div>

                <button type="submit" class="btn-submit">
                    Adicionar filme
                </button>
            </form>

        </div>

    </div>


    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>
                Desenvolvido por Letícia Cibele
            </p>

            <div class="social-links">
                <a href="https://github.com/lehcibele" target="_blank" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="https://www.linkedin.com/in/let%C3%ADcia-cibele/" target="_blank" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin"></i>
                </a>

                <a href="https://www.instagram.com/leh_cibelle/" target="_blank" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>
        </div>
    </footer>

    <script src="src/js/script.js"></script>
    
</body>
</html>
